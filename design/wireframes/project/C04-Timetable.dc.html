<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600&amp;family=Work+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:"Work Sans",system-ui,sans-serif;color:#3B3A2A}
a{color:#5E5B3B}a:hover{color:#3B3A2A}
.h{font-family:"Lexend Deca",system-ui,sans-serif;text-transform:lowercase;letter-spacing:.02em;font-weight:500;color:#5E5B3B;margin:0}
.lbl{font-family:"Lexend Deca",sans-serif;font-size:13px;text-transform:lowercase;letter-spacing:.06em;color:#66624A;margin:6px 0 0}
.muted{color:#66624A}
.card{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 1px 0 #E8E3C5}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:26px;border:0;background:#5E5B3B;color:#FFF4E6;font:600 16px "Work Sans",sans-serif;text-decoration:none;box-sizing:border-box}
.btn:hover{color:#FFF4E6;background:#4E4B30}
.btn2{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:26px;border:1.5px solid #5E5B3B;background:transparent;color:#5E5B3B;font:600 16px "Work Sans",sans-serif;text-decoration:none;box-sizing:border-box}
.danger{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:26px;border:1.5px solid #A44A2C;background:#fff;color:#A44A2C;font:600 16px "Work Sans",sans-serif;text-decoration:none;box-sizing:border-box}
.pill{font-size:13px;background:#E8E3C5;border-radius:14px;padding:6px 12px}
.iconbtn{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#5E5B3B;border-radius:22px}
.back{width:44px;height:44px;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;color:#5E5B3B;box-shadow:0 1px 0 #E8E3C5;flex:none}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;color:#3B3A2A}
.pay{background:#fff;color:#A44A2C;box-shadow:inset 0 0 0 1.5px #A44A2C}
.ok{background:#C3BF94;color:#3B3A2A}
.new{background:#E8E3C5;color:#3B3A2A}
.todo{background:#FFF1D6;color:#7A4E00}
.later{background:#ECE6F5;color:#4B3A80}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;color:#66624A;text-decoration:none}
.tab.on{color:#5E5B3B;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#E8E3C5;border-radius:22px;padding:4px}
.seg button{min-height:40px;border:0;border-radius:18px;background:transparent;font:500 15px "Work Sans",sans-serif;color:#3B3A2A}
.seg .on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(59,58,42,.15)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
input{border:1.5px solid #C3BF94;border-radius:16px;min-height:52px;padding:0 16px;font:16px "Work Sans",sans-serif;background:#fff;color:#3B3A2A;box-sizing:border-box;width:100%}
.pill{display:inline-flex;align-items:center;min-height:38px;padding:0 16px;border-radius:19px;font:500 14px "Work Sans",sans-serif;border:0;background:#E8E3C5;color:#3B3A2A}
.pill.on{background:#5E5B3B;color:#FFF4E6}
.scard{background:#fff;border-radius:20px;padding:10px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 0 #E8E3C5}
.pic{width:60px;height:60px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center}
.book{min-height:40px;min-width:74px;padding:0 16px;border-radius:20px;border:0;background:#5E5B3B;color:#FFF4E6;font:600 15px "Work Sans",sans-serif;text-decoration:none;display:flex;align-items:center;justify-content:center}
.day{font-family:"Lexend Deca",sans-serif;font-size:13px;text-transform:lowercase;letter-spacing:.06em;color:#66624A;margin:8px 0 0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;color:#66624A;text-decoration:none}
.tab.on{color:#5E5B3B;font-weight:600}
.lang{font-size:13px;background:#E8E3C5;border-radius:14px;padding:6px 12px;color:#3B3A2A}
.check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15.5px}
.check input{width:22px;height:22px;min-height:0;margin:0;padding:0;accent-color:#5E5B3B;flex:none}
.seg a{display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:18px;text-decoration:none;font:500 15px "Work Sans",sans-serif;color:#3B3A2A}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#E8E3C5;border-radius:22px;padding:4px}
.seg3 a{display:flex;align-items:center;justify-content:center;min-height:36px;border-radius:18px;text-decoration:none;font:500 14px "Work Sans",sans-serif;color:#3B3A2A}
.seg3 a.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(59,58,42,.15)}
.langbtn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:18px;border:0;background:#E8E3C5;color:#3B3A2A;font:600 14px "Work Sans",sans-serif;white-space:nowrap}
.menubtn{width:44px;height:44px;border-radius:22px;background:#FFF4E6;display:flex;align-items:center;justify-content:center;color:#5E5B3B;flex:none}
.teamnote{border:1.5px dashed #9A9578;border-radius:14px;padding:8px 12px;font-size:12.5px;line-height:1.4;color:#66624A}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFF4E6">
  <div style="display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 8px 0 18px">
    <img src="/_blob/c1b0089e9a52d0be853b1cd83c2c00bb" alt="the village." style="height:34px;width:auto">
    <div style="display:flex;align-items:center;gap:2px">
      <button class="langbtn" type="button" aria-label="Language: English. Tap for Tiếng Việt"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"></path></svg>EN</button>
      <a class="iconbtn" href="C14-Menu.dc.html" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a>
    </div>
  </div>
  <div style="flex:1;overflow:hidden;padding:6px 16px 12px;display:flex;flex-direction:column;gap:10px">
    <div class="h" style="font-size:28px">hi lan</div>
    <nav class="seg3" aria-label="Timetable view"><a class="on" href="C04-Timetable.dc.html" aria-current="page">List</a><a href="C04b-TimetableWeek.dc.html">Week</a><a href="C04c-TimetableMonth.dc.html">Month</a></nav>
    <div style="display:flex;align-items:center;justify-content:space-between;background:#E8E3C5;border-radius:22px">
      <button class="iconbtn" type="button" aria-label="Previous week"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <strong style="font-size:15px">2 – 8 November</strong>
      <button class="iconbtn" type="button" aria-label="Next week"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>
    <div style="display:flex;gap:8px">
      <button class="pill on" type="button">All</button>
      <button class="pill" type="button">Classes</button>
      <button class="pill" type="button">Open play</button>
    </div>
    <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
      <p class="day">{{d.label}}</p>
      <sc-for list="{{d.items}}" as="s" hint-placeholder-count="3">
        <div class="scard">
          <div class="pic" style="{{s.pic}}"><img src="/_blob/fdd3f188eae36e810c987e6015355517" alt="" style="width:40px;height:40px"></div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:15.5px">{{s.title}}</div>
            <div style="font-size:13.5px;color:#66624A">{{s.time}} · {{s.who}}</div>
            <div style="font-size:13.5px;margin-top:2px">{{s.left}}</div>
          </div>
          <sc-if value="{{s.full}}" hint-placeholder-val="{{false}}">
            <span style="font-size:14px;font-weight:600;color:#66624A;padding:0 10px">Full</span>
          </sc-if>
          <sc-if value="{{s.open}}" hint-placeholder-val="{{true}}">
            <a class="book" href="{{s.href}}">Book</a>
          </sc-if>
          <sc-if value="{{s.mine}}" hint-placeholder-val="{{false}}">
            <span class="tag ok" style="padding:6px 10px">Booked ✓</span>
          </sc-if>
        </div>
      </sc-for>
    </sc-for>
  </div>
  <nav style="display:flex;background:#fff;height:68px;border-radius:24px 24px 0 0;box-shadow:0 -1px 0 #E8E3C5">
    <a class="tab on" href="C04-Timetable.dc.html"><span style="width:6px;height:6px;border-radius:3px;background:#E88D6D"></span>Classes</a>
    <a class="tab" href="C10-MyBookings.dc.html"><span style="width:6px;height:6px"></span>Bookings</a>
    <a class="tab" href="C12-MyPackages.dc.html"><span style="width:6px;height:6px"></span>Packages</a>
  </nav>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = { c: 'background:#C3BF94', o: 'background:#FFBEA1' };
    const H = { c: 'C05-Session.dc.html', o: 'C07-ConfirmOpenPlay.dc.html' };
    const s = (k, title, time, who, left, state) => ({ pic: P[k], href: H[k], title, time, who, left, full: state === 'full', open: state === 'open', mine: state === 'mine' });

      days: [
        { label: 'monday 2 nov', items: [
          s('c', 'Pilates Flow', '9:00–10:00', 'Mai', '4 of 10 places left', 'mine'),
          s('o', 'Open Play', '10:30–12:00', 'Staff', '150,000 ₫ per child', 'open'),

        ]},
        { label: 'tuesday 3 nov', items: [
          s('c', 'Mum & Baby Yoga', '9:30–10:30', 'Mai', '7 of 10 places left', 'open'),
          s('c', 'Dance Fit', '16:00–17:00', 'Thu', '2 of 10 places left', 'open')
        ]}
      ]
    };
  }
}
</script>
