<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classes timetable</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1F2328}
a{color:#2F5D8A}a:hover{color:#1E3F60}
.muted{color:#5B616B}
.hdr{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 8px 0 16px;border-bottom:1px solid #E4E6EA}
.lang{font-size:13px;color:#5B616B}
.iconbtn{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#1F2328;border-radius:22px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid #B9BEC6;background:#fff;font:500 14px system-ui,sans-serif;color:#1F2328}
.chip.on{background:#1F2328;color:#fff;border-color:#1F2328}
.card{border:1px solid #D9DCE1;border-radius:14px;padding:10px;background:#fff;display:flex;gap:12px;align-items:center}
.pic{width:56px;height:56px;border-radius:12px;border:1.5px dashed #B9BEC6;background:#F7F7F8;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:#5B616B;text-align:center}
.book{min-height:40px;min-width:72px;padding:0 14px;border-radius:20px;border:1.5px solid #3F6B52;background:#E3EEE6;color:#24452F;font:600 15px system-ui,sans-serif;text-decoration:none;display:flex;align-items:center;justify-content:center}
.day{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#5B616B;margin:6px 0 0}
.tab{flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5B616B;text-decoration:none}
.tab.on{color:#24452F;font-weight:700;box-shadow:inset 0 3px 0 #3F6B52}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#fff">
  <div class="hdr">
    <strong style="font-size:17px">The Village</strong>
    <div style="display:flex;align-items:center;gap:4px">
      <span class="lang"><strong style="color:#1F2328">EN</strong> · VI</span>
      <a class="iconbtn" href="C14-Menu.dc.html" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></a>
    </div>
  </div>
  <div style="flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:10px">
    <h1 style="margin:0;font-size:24px">Hi Phuong</h1>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <button class="iconbtn" type="button" aria-label="Previous week"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <strong style="font-size:15px">2 – 8 November</strong>
      <button class="iconbtn" type="button" aria-label="Next week"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div style="display:flex;gap:8px">
      <button class="chip on" type="button">All</button>
      <button class="chip" type="button">Classes</button>
      <button class="chip" type="button">Open play</button>
    </div>
    <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
      <p class="day">{{d.label}}</p>
      <sc-for list="{{d.items}}" as="s" hint-placeholder-count="3">
        <div class="card">
          <div class="pic">picture</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:15px">{{s.title}}</div>
            <div class="muted" style="font-size:13.5px">{{s.time}} · {{s.who}}</div>
            <div style="font-size:13.5px;margin-top:2px">{{s.left}}</div>
          </div>
          <sc-if value="{{s.full}}" hint-placeholder-val="{{false}}">
            <span class="muted" style="font-size:14px;font-weight:600;padding:0 10px">Full</span>
          </sc-if>
          <sc-if value="{{s.open}}" hint-placeholder-val="{{true}}">
            <a class="book" href="C05-Session.dc.html">Book</a>
          </sc-if>
          <sc-if value="{{s.mine}}" hint-placeholder-val="{{false}}">
            <span style="font-size:13px;font-weight:700;color:#24452F;background:#E3EEE6;border-radius:10px;padding:4px 8px">Booked ✓</span>
          </sc-if>
        </div>
      </sc-for>
    </sc-for>
  </div>
  <nav style="display:flex;border-top:1px solid #E4E6EA;height:64px">
    <a class="tab on" href="C04-Timetable.dc.html">Classes</a>
    <a class="tab" href="C10-MyBookings.dc.html">Bookings</a>
    <a class="tab" href="C12-MyPackages.dc.html">Packages</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (title, time, who, left, state) => ({ title, time, who, left, full: state === 'full', open: state === 'open', mine: state === 'mine' });
    return {
      days: [
        { label: 'Monday 2 Nov', items: [
          s('Pilates Flow', '9:00–10:00', 'Mai', '4 of 10 places left', 'mine'),
          s('Open Play', '10:30–12:00', 'Staff', '5 child places left', 'open'),
          s('Strength', '17:30–18:30', 'Anna', 'Full', 'full')
        ]},
        { label: 'Tuesday 3 Nov', items: [
          s('Mum & Baby Yoga', '9:30–10:30', 'Mai', '7 of 10 places left', 'open'),
          s('Dance Fit', '18:00–19:00', 'Thu', '2 of 10 places left', 'open')
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
