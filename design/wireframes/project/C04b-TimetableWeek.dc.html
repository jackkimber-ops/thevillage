<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const F = { c: 'background:#C3BF94', o: 'background:#FFBEA1', f: 'background:#EFE9D6;color:#66624A' };
    const H = { c: 'C05-Session.dc.html', o: 'C07-ConfirmOpenPlay.dc.html' };
    const e = (k, start, len, t, time, state) => {
      let st = (state === 'full' ? F.f : F[k]) + ';top:' + Math.round((start - 8.5) * 44 + 2) + 'px;height:' + Math.round(len * 44 - 4) + 'px';
      if (state === 'mine') st += ';box-shadow:inset 0 0 0 2px #5E5B3B';
      return { t, sub: time, style: st, href: state === 'full' ? 'C04b-TimetableWeek.dc.html' : H[k], aria: t + ' ' + time + (state === 'full' ? ', full' : state === 'mine' ? ', you are booked' : '') };
    };
    const days = [
      { dow: 'Mon', num: '2', cls: 'dh today', items: [e('c', 9, 1, 'Pilates', '9:00', 'mine'), e('o', 10.5, 1.5, 'Open play', '10:30'), e('c', 15.5, 1, 'Strength', '15:30', 'full')] },
      { dow: 'Tue', num: '3', cls: 'dh', items: [e('c', 9.5, 1, 'Yoga', '9:30'), e('c', 16, 1, 'Dance', '16:00')] },
      { dow: 'Wed', num: '4', cls: 'dh', items: [e('c', 9, 1, 'Pilates', '9:00'), e('o', 10.5, 1.5, 'Open play', '10:30')] },
      { dow: 'Thu', num: '5', cls: 'dh', items: [e('c', 9.5, 1, 'Yoga', '9:30')] },
      { dow: 'Fri', num: '6', cls: 'dh', items: [e('c', 9, 1, 'Pilates', '9:00'), e('c', 15.5, 1, 'Strength', '15:30')] },
      { dow: 'Sat', num: '7', cls: 'dh', items: [e('o', 9, 1.5, 'Open play', '9:00')] },

    ];
    const hours = [];
    for (let h = 9; h <= 16; h++) hours.push({ label: String(h), style: 'top:' + Math.round((h - 8.5) * 44 - 6) + 'px' });
    return { days, hours };
  }
}
