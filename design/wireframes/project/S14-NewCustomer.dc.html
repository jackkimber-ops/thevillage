<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a new customer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1F2328}
a{color:#2F5D8A}a:hover{color:#1E3F60}
.muted{color:#5B616B}
.hdr{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;border-bottom:1px solid #E4E6EA}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:24px;border:1.5px solid #3F6B52;background:#E3EEE6;color:#24452F;font:600 16px system-ui,sans-serif;text-decoration:none}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:14px;font-weight:600}
.field input{border:1px solid #9AA0A8;border-radius:10px;min-height:44px;padding:0 12px;font-size:16px;box-sizing:border-box;width:100%;background:#fff}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid #9AA0A8;border-radius:12px;overflow:hidden}
.seg button{min-height:40px;border:0;background:#fff;font:500 14px system-ui,sans-serif;color:#1F2328}
.seg .on{background:#1F2328;color:#fff}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#fff">
  <div class="hdr">
    <a href="S13-BookCustomer.dc.html" style="font-size:15px;text-decoration:none">← Back</a>
    <span class="muted" style="font-size:13px">Staff</span>
  </div>
  <form style="flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:10px">
    <h1 style="margin:0;font-size:22px">New customer</h1>
    <div class="field"><label for="n">Name</label><input id="n" value="Hoa Le"></div>
    <div class="field"><label for="p">Phone (WhatsApp)</label><input id="p" type="tel" value="+84 91 777 8888"></div>
    <div class="field"><label for="e">Email</label><input id="e" type="email" value="hoa@example.com"></div>
    <div class="field"><label>Language for emails</label><div class="seg"><button class="on" type="button">English</button><button type="button">Tiếng Việt</button></div></div>
    <div style="font-size:14px;font-weight:600;margin-top:4px">Child <span class="muted" style="font-weight:400">(optional)</span></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <div class="field"><label for="c1" style="font-weight:400;font-size:13px">Name</label><input id="c1" value="Minh"></div>
      <div class="field"><label for="c2" style="font-weight:400;font-size:13px">Born (month/year)</label><input id="c2" value="11 / 2025"></div>
    </div>
    <a href="S14-NewCustomer.dc.html" style="font-size:14px">+ Add a second child</a>
    <p class="muted" style="margin:4px 0 0;font-size:13px;line-height:1.45">They get a welcome email in their language with the booking link. If the phone or email already belongs to a customer, we open that customer instead of making a second account.</p>
    <a class="btn" href="S13-BookCustomer.dc.html" style="margin-top:auto">Save and book</a>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
