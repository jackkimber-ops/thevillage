<style>
body{margin:0;font-family:"Work Sans",system-ui,sans-serif;color:#3B3A2A}
a{color:#5E5B3B}a:hover{color:#3B3A2A}
h1,h2,h3{font-family:"Lexend Deca",system-ui,sans-serif;font-weight:500;letter-spacing:.01em}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:24px;border:1.5px solid #5E5B3B;background:#5E5B3B;color:#FFF4E6;font:600 16px "Work Sans",sans-serif;text-decoration:none;box-sizing:border-box}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:24px;border:1.5px solid #5E5B3B;background:transparent;color:#5E5B3B;font:600 16px "Work Sans",sans-serif;text-decoration:none;box-sizing:border-box}
.muted{color:#66624A}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.hdr{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;border-bottom:1px solid #E8E3C5}
.lang{font-size:13px;color:#66624A}
.digit{width:44px;height:56px;border:1px solid #868259;border-radius:10px;font-size:24px;text-align:center;box-sizing:border-box}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFF4E6">
  <div class="hdr">
    <a href="Main.dc.html" style="font-size:15px;text-decoration:none">← Back</a>
    <span class="lang"><strong style="color:#3B3A2A">EN</strong> · VI</span>
  </div>
  <div style="flex:1;padding:32px 20px;display:flex;flex-direction:column;gap:20px">
    <div>
      <h1 style="margin:0 0 8px;font-size:26px">Check your email</h1>
      <p class="muted" style="margin:0;font-size:15px;line-height:1.45">We sent a 6-digit code to <strong style="color:#3B3A2A">lan@example.com</strong>. It works for 10 minutes.</p>
    </div>
    <form style="display:flex;flex-direction:column;gap:16px">
      <label for="d1" style="font-size:14px;font-weight:600">Code</label>
      <div style="display:flex;gap:8px;justify-content:space-between">
        <input id="d1" class="digit" inputmode="numeric" value="4" aria-label="Digit 1">
        <input class="digit" inputmode="numeric" value="8" aria-label="Digit 2">
        <input class="digit" inputmode="numeric" value="1" aria-label="Digit 3">
        <input class="digit" inputmode="numeric" aria-label="Digit 4">
        <input class="digit" inputmode="numeric" aria-label="Digit 5">
        <input class="digit" inputmode="numeric" aria-label="Digit 6">
      </div>
      <button class="btn" type="button">Log in</button>
    </form>
    <p class="muted" style="margin:0;font-size:14px;line-height:1.45">On iPhone the code can fill in by itself from the Mail app. WhatsApp and Zalo codes: tap <em>Copy code</em> in the message, then paste here.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:auto">
      <button class="btn2" type="button">Send a new code</button>
      <a href="Main.dc.html" style="text-align:center;font-size:15px;padding:12px">Use a different email</a>
    </div>
  </div>
</div>
