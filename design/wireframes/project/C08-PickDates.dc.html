<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick dates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600&amp;family=Work+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:"Work Sans",system-ui,sans-serif;color:#3B3A2A}
a{color:#5E5B3B}a:hover{color:#3B3A2A}
.h{font-family:"Lexend Deca",system-ui,sans-serif;text-transform:lowercase;letter-spacing:.02em;font-weight:500;color:#5E5B3B;margin:0}
.lbl{font-family:"Lexend Deca",sans-serif;font-size:13px;text-transform:lowercase;letter-spacing:.06em;color:#66624A;margin:6px 0 0}
.muted{color:#66624A}
.card{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 1px 0 #E8E3C5}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:26px;border:0;background:#5E5B3B;color:#FFF4E6;font:600 16px "Work Sans",sans-serif;text-decoration:none;box-sizing:border-box}
.btn:hover{color:#FFF4E6;background:#4E4B30}
.btn2{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:26px;border:1.5px solid #5E5B3B;background:transparent;color:#5E5B3B;font:600 16px "Work Sans",sans-serif;text-decoration:none;box-sizing:border-box}
.danger{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:26px;border:1.5px solid #A44A2C;background:#fff;color:#A44A2C;font:600 16px "Work Sans",sans-serif;text-decoration:none;box-sizing:border-box}
.pill{font-size:13px;background:#E8E3C5;border-radius:14px;padding:6px 12px}
.iconbtn{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#5E5B3B;border-radius:22px}
.back{width:44px;height:44px;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;color:#5E5B3B;box-shadow:0 1px 0 #E8E3C5;flex:none}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;color:#3B3A2A}
.pay{background:#fff;color:#A44A2C;box-shadow:inset 0 0 0 1.5px #A44A2C}
.ok{background:#C3BF94;color:#3B3A2A}
.new{background:#E8E3C5;color:#3B3A2A}
.todo{background:#FFF1D6;color:#7A4E00}
.later{background:#ECE6F5;color:#4B3A80}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;color:#66624A;text-decoration:none}
.tab.on{color:#5E5B3B;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#E8E3C5;border-radius:22px;padding:4px}
.seg button{min-height:40px;border:0;border-radius:18px;background:transparent;font:500 15px "Work Sans",sans-serif;color:#3B3A2A}
.seg .on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(59,58,42,.15)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
input{border:1.5px solid #C3BF94;border-radius:16px;min-height:52px;padding:0 16px;font:16px "Work Sans",sans-serif;background:#fff;color:#3B3A2A;box-sizing:border-box;width:100%}
.date{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 16px;background:#fff;border-radius:18px;box-shadow:0 1px 0 #E8E3C5}
.date input{width:22px;height:22px;margin:0;accent-color:#5E5B3B}
.date label{flex:1;font-size:15.5px;font-weight:500}
.cr{background:#C3BF94;color:#3B3A2A}
.full{background:#E8E3C5;color:#66624A}
.lang{font-size:13px;background:#E8E3C5;border-radius:14px;padding:6px 12px;color:#3B3A2A}
.check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15.5px}
.check input{width:22px;height:22px;min-height:0;margin:0;padding:0;accent-color:#5E5B3B;flex:none}
.seg a{display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:18px;text-decoration:none;font:500 15px "Work Sans",sans-serif;color:#3B3A2A}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFF4E6">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px">
    <a class="back" href="C06-ConfirmClass.dc.html" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span class="tag later">+1 month release</span>
  </div>
  <div style="flex:1;padding:4px 18px 10px;display:flex;flex-direction:column;gap:10px;overflow:hidden">
    <div>
      <div class="h" style="font-size:28px">pick dates</div>
      <div class="muted" style="font-size:15px">Pilates Flow · Mondays 9:00 · up to 1 month ahead</div>
    </div>
    <p style="margin:0 0 4px;font-size:14px;line-height:1.45;background:#E8E3C5;border-radius:16px;padding:10px 12px">Tick the dates you want. Each date is its own booking with its own cancellation time. Nothing repeats by itself.</p>
    <sc-for list="{{dates}}" as="d" hint-placeholder-count="5">
      <div class="date" style="{{d.style}}">
        <input type="checkbox" id="{{d.id}}" checked="{{d.on}}" disabled="{{d.full}}">
        <label for="{{d.id}}">{{d.label}}</label>
        <span class="tag {{d.cls}}">{{d.note}}</span>
      </div>
    </sc-for>
    <div class="card" style="margin-top:4px;font-size:15px;line-height:1.45">
      <strong>4 dates</strong> · 3 credits from your 10-class pack + 1 pay on the day (450,000 ₫)
    </div>
  </div>
  <div style="padding:10px 18px 20px">
    <a class="btn" href="C09-Booked.dc.html">Book 4 dates</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = (id, label, on, cls, note, full) => ({ id, label, on, cls, note, full: !!full, style: full ? 'opacity:.6' : '' });
    return {
      dates: [
        d('d1', 'Mon 2 Nov', true, 'cr', '1 credit'),
        d('d2', 'Mon 9 Nov', true, 'cr', '1 credit'),
        d('d3', 'Mon 16 Nov', false, 'full', 'Full', true),
        d('d4', 'Mon 23 Nov', true, 'cr', '1 credit'),
        d('d5', 'Mon 30 Nov', true, 'pay', 'Pay on the day')
      ]
    };
  }
}
</script>
</body>
</html>
