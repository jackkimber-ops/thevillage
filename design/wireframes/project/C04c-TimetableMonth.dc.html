<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const CL = 'background:#868259', OP = 'background:#A44A2C';
    const names = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const cells = [];
    for (let i = 0; i < 6; i++) cells.push({ blank: true, day: false });
    for (let n = 1; n <= 30; n++) {
      const dow = (n + 5) % 7; // 1 Nov 2026 is a Sunday (index 6)
      const dots = dow >= 5 ? [OP] : (dow === 0 || dow === 2) ? [CL, OP] : [CL];
      const late = n > 22; // booking window: 1 month ahead
      const mine = n === 2 || n === 9;
      let cls = 'cell' + (n === 2 ? ' sel' : '') + (mine ? ' mine' : '') + (late ? ' late' : '');
      cells.push({ blank: false, day: true, n: String(n), cls, dots: late ? [] : dots, aria: names[dow] + ' ' + n + ' November' + (mine ? ', you are booked' : '') + (late ? ', opens for booking later' : '') });
    }
    return { dows: names.map(d => d.slice(0, 2)), cells };
  }
}
</script>
