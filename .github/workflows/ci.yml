name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  booking:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/booking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/booking/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
